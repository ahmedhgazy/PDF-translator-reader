<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0f24"/>
      <stop offset="100%" stop-color="#151833"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#brandGrad)" stroke-width="8" stroke-opacity="0.3"/>

  <!-- PDF Document Shape -->
  <g filter="url(#glow)">
    <path d="M128 100 C128 86.7452 138.745 76 152 76 H288 L384 172 V412 C384 425.255 373.255 436 360 436 H152 C138.745 436 128 425.255 128 412 V100 Z" 
          fill="url(#brandGrad)"/>
    <path d="M288 76 V160 C288 166.627 293.373 172 300 172 H384 L288 76 Z" 
          fill="#ffffff" opacity="0.35"/>
  </g>

  <!-- Inner Document Canvas -->
  <rect x="156" y="132" width="200" height="272" rx="16" fill="#0d0f24" opacity="0.88"/>

  <!-- Document Text Skeleton Lines -->
  <rect x="184" y="168" width="144" height="14" rx="7" fill="#ffffff" opacity="0.9"/>
  <rect x="184" y="196" width="112" height="14" rx="7" fill="#ffffff" opacity="0.5"/>
  <rect x="184" y="224" width="128" height="14" rx="7" fill="#ffffff" opacity="0.5"/>

  <!-- Translation Emblem Circle -->
  <circle cx="332" cy="332" r="76" fill="url(#brandGrad)"/>
  <circle cx="332" cy="332" r="66" fill="#0d0f24"/>
  <circle cx="332" cy="332" r="66" fill="url(#brandGrad)" opacity="0.2"/>

  <!-- Translation Badge Letter 'A' and Arrow Symbol -->
  <text x="294" y="344" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="36" font-weight="800" fill="#ffffff">A</text>
  <path d="M336 322 L354 332 L336 342" stroke="url(#sparkleGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M322 332 L352 332" stroke="url(#sparkleGrad)" stroke-width="5" stroke-linecap="round" fill="none"/>
</svg>
